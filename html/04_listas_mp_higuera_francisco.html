<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Listas</h1>
    <h1>Lista Desordenada</h1>
    <!-- Lista de elementos sin orden específico (unordered list) -->
    <ul>
        <li>Luke Skywalker</li>
        <li>Leia Organa</li>
        <li>Han Solo</li>
        <li>Darth Vader</li>
    </ul>
    <h1>Lista Ordenada</h1>
    <!-- Lista de elementos con orden específico (ordered list) -->
    <ol>
        <li>Luke Skywalker</li>
        <li>Leia Organa</li>
        <li>Han Solo</li>
        <li>Darth Vader</li>
    </ol>

    <h1>Lista Ordenada</h1>
    <!-- Lista de elementos con orden específico (ordered list) -->
    <ol type="A">
        <li>Luke Skywalker</li>
        <li>Leia Organa</li>
        <li>Han Solo</li>
        <li>Darth Vader</li>
    </ol>
</body>
</html>
