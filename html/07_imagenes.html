<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes</title>
</head>
<body>
    <h1> Utilización de la etiquet Img</h1>
    <img 
    src="images/yoda.webp" 
    alt="Maestro Yoda"
    width="300"
    height="350"
    loading="eager"
    >

    <img 
    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQAFE_w3dzhF6W62yBnERQRgZ08RyxFfIp_qffZ4bdw0A&s=10" 
    alt="Maestro Yoda"
    width="500"
    height="350"
    loading="eager"
    >

    <img 
        src="images/personajes/luck_y_yoda.jpeg" 
        alt="Maestro Yoda"
        width="500"
        height="350"
        loading="eager"
    >

    <figure>
        <img 
        src="../images/yoda1.jpeg" 
        alt="Maestro Yoda"
        width="500"
        height="350"
        loading="eager">
        <figcaption>
            Maestro Yoda, integrante del Consejo Jedi
        </figcaption>
    </figure>
    <a href="https://es.wikipedia.org/wiki/Star_Wars"
        target="_blank"
        >
        <img src="images/Star_wars2.svg" 
            alt="Star Wars"
            width="200"
            >
    </a>
    

</body>
</html>
